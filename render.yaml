# Render blueprint for Muster.
#
# Two things about this app decide the shape of the deployment.
#
# Twilio opens a media stream back to the server for the length of every call,
# so Muster has to be a web service that stays up, not a job that wakes, runs
# and exits. And the round is driven by a timer inside that process, checking
# the clock every thirty seconds, so the process being asleep at call time
# means no calls go out.
#
# This blueprint uses the free instance, which needs no card. Two limits come
# with it, and both have answers:
#
#   It sleeps after about fifteen minutes idle. An uptime pinger hitting
#   /health every ten minutes keeps it awake. A month is 720 hours and the
#   free allowance is 750 instance hours, so one always awake service fits.
#   The scheduler also recovers on its own: it runs a round it slept through,
#   as long as calling hours have not ended.
#
#   It has no disk, so data/ is wiped on every deploy and restart. Muster
#   answers that itself: with UPSTASH_REDIS_REST_URL and _TOKEN set, the data
#   directory is mirrored to a key value store after every write and restored
#   at boot, so accounts, crew, bookings and transcripts survive.
#
# For real use, switch to the paid instance with a disk. The last comment in
# this file says how.

services:
  - type: web
    name: muster
    runtime: node
    plan: free
    # TypeScript is compiled here, once, rather than at every boot. Running
    # through ts-node holds the compiler and the whole program in memory at
    # startup, which a 512MB free instance does not survive: the first deploy
    # died with "JavaScript heap out of memory". The built server starts in
    # about 70MB. --include=dev because the compiler is a devDependency.
    buildCommand: npm ci --include=dev
    # npm start compiles first, through prestart, then runs the built server.
    # A host that was configured before this change still ends up compiled.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # The address Twilio dials back on, and the one email links point to.
      # Render sets RENDER_EXTERNAL_URL itself, which Muster reads, so this is
      # only needed for a custom domain.
      - key: MUSTER_PUBLIC_URL
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Keeps the data through a wipe. Without these two, a deploy or restart
      # loses every account, booking and transcript. Free at upstash.com, no card.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Traffic is what stops a free instance sleeping, and a sleeping process
      # places no calls, so the server asks for its own health endpoint on a
      # timer. An outside monitor is still worth having: this cannot wake a
      # process that is already asleep.
      - key: MUSTER_KEEP_AWAKE
        value: "true"
      # Set to "true" while showing Muster to people who need their own
      # account. With the data kept, the first sign up owns the workspace.
      - key: MUSTER_OPEN_SIGNUP
        value: "false"
      # Set these in the dashboard only if you use them:
      #   MUSTER_PHONE_OVERRIDE   ring one verified number while testing
      #   MUSTER_BREVO_KEY        sending confirmation and reset links, to anyone
      #   MUSTER_RESEND_KEY       the same, but only to the account holder
      #   MUSTER_MAIL_FROM        Muster <you@gmail.com>
      #   MUSTER_SUPPORT_EMAIL
      #   MUSTER_PLAN             free, pro or business

# Keeping data through a deploy, when this stops being a demonstration:
#
#   plan: starter
#   disk:
#     name: muster-data
#     mountPath: /var/lib/muster
#     sizeGB: 1
#
# and add MUSTER_DATA_DIR=/var/lib/muster to envVars. That instance never
# sleeps, so the uptime pinger can be switched off at the same time.
