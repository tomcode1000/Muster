<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check in with Muster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f7fc; --navy: #0e1733; --ink: #121a33; --body: #4a5268; --muted: #8a90a2; --line: #e8ebf3; --blue: #2f5bea; --blue-2: #1f6bff; --green: #1f9463; --red: #e0433f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); }

  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--navy); }
  .brand svg { width: 26px; height: 23px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 30px rgba(20, 28, 70, .05); }
  .job { padding: 18px; margin-top: 16px; }
  .job .who { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
  .job h1 { margin: 8px 0 0; font-size: 22px; line-height: 1.25; font-weight: 800; letter-spacing: -0.02em; color: var(--navy); }
  .job p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--body); }
  .facts { display: grid; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .fact { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; }
  .fact .ic { width: 30px; height: 30px; border-radius: 9px; background: #eef2fb; color: var(--blue); display: grid; place-items: center; }
  .fact b { display: block; font-size: 13px; color: var(--navy); }
  .fact small { display: block; margin-top: 1px; font-size: 11.5px; color: var(--muted); }

  .talk { margin-top: 18px; padding: 22px 18px 20px; text-align: center; }
  .orb { position: relative; width: 132px; height: 132px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #e7edfd, #dbe5fb); color: var(--blue); }
  .orb svg { width: 44px; height: 44px; }
  .orb.live { background: radial-gradient(circle at 50% 40%, #e3f5eb, #d3eede); color: var(--green); }
  .orb.live::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(31, 148, 99, .35); animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.94); opacity: .9 } 100% { transform: scale(1.12); opacity: 0 } }
  .talk h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--navy); }
  .talk p { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--body); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px; margin-top: 18px; border: 0;
    border-radius: 14px; background: var(--blue-2); color: #fff; font: 600 15px "Plus Jakarta Sans", sans-serif; }
  .btn.end { background: #fdeaea; color: #c93a36; }
  .btn:disabled { opacity: .55; }
  .note { margin-top: 12px; font-size: 12px; line-height: 1.6; color: var(--muted); text-align: center; }
  .note.bad { color: #b3363b; }

  .turns { display: grid; gap: 10px; margin-top: 16px; }
  .turn { max-width: 84%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; }
  .turn small { display: block; margin-bottom: 3px; font-size: 10.5px; font-weight: 700; opacity: .7; }
  .turn.agent { justify-self: start; background: #eef2fb; color: var(--ink); border-top-left-radius: 4px; }
  .turn.foreman { justify-self: end; background: #e3ebfd; color: #1d3a8f; border-top-right-radius: 4px; }

  .done { padding: 26px 18px; text-align: center; }
  .done .tick { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: #e3f5eb; color: var(--green); display: grid; place-items: center; }
  .done .tick svg { width: 30px; height: 30px; stroke-width: 2.4; }
  .done h2 { margin: 0; font-size: 19px; font-weight: 800; color: var(--navy); }
  .done p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--body); }
  .done ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 9px; text-align: left; }
  .done li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 13px; color: #3b4459; }
  .done li svg { width: 16px; height: 16px; color: var(--green); }
  .foot { margin-top: 20px; text-align: center; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 32 28" aria-hidden="true"><g fill="#2f5bea"><rect x="0" y="10" width="3.4" height="8" rx="1.7"/><rect x="7" y="4" width="3.4" height="20" rx="1.7"/><rect x="14" y="0" width="3.4" height="28" rx="1.7"/><rect x="21" y="6" width="3.4" height="16" rx="1.7"/><rect x="28" y="11" width="3.4" height="6" rx="1.7"/></g></svg>
    Muster
  </div>
  <div id="view"></div>
  <p class="foot">No account needed. This link is for you only.</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const view = $("view");
const token = new URLSearchParams(location.search).get("t") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clock = (t) => { if (!t) return ""; const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "PM" : "AM"}`; };
const ICON = {
  mic: '<path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3z"/><path d="M19 11a7 7 0 01-14 0M12 18v3"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="2"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  work: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="12" cy="6" r="2.5"/><path d="M10.5 8l-3 7.8M13.5 8l3 7.8M8.5 18h7"/>',
  pin: '<path d="M12 21s7-6.2 7-12a7 7 0 00-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  crew: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.5a3.5 3.5 0 010 7"/>',
};
const icon = (n, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

let job = null, ws = null, ctx = null, mic = null, node = null, playHead = 0, sources = [], callId = null, poll = null;
const LISTEN_AGAIN_AFTER_MS = 350;
let speakingUntil = 0;
const musterIsSpeaking = () => performance.now() < speakingUntil;

async function load() {
  if (!token) return fail("This link is incomplete. Ask your superintendent to send it again.");
  try {
    const res = await fetch(`/api/foreman/${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok) return fail(data.error || "This link no longer works.");
    job = data;
    draw();
  } catch {
    fail("Could not reach Muster. Check your connection and open the link again.");
  }
}

function fail(message) {
  view.innerHTML = `<section class="card talk"><h2>Link not working</h2><p>${esc(message)}</p></section>`;
}

function draw() {
  const spanish = job.language === "es";
  view.innerHTML = `
    <section class="card job">
      <div class="who">${esc(job.project)}</div>
      <h1>${spanish ? "Confirme el trabajo de mañana" : "Confirm tomorrow's work"}</h1>
      <p>${spanish
        ? `Hola ${esc(job.foreman)}. ${esc(job.superintendent)} quiere confirmar unos detalles. Toma un minuto.`
        : `Hi ${esc(job.foreman)}. ${esc(job.superintendent)} needs to confirm a few details. It takes a minute.`}</p>
      <div class="facts">
        <div class="fact"><span class="ic">${icon("work")}</span><span><b>${esc(job.work)}</b><small>${esc(job.company)}</small></span></div>
        <div class="fact"><span class="ic">${icon("pin")}</span><span><b>${esc(job.area)}</b><small>${spanish ? "Zona" : "Area"}</small></span></div>
        <div class="fact"><span class="ic">${icon("clock")}</span><span><b>${clock(job.start)}</b><small>${spanish ? "Hora de inicio" : "Start time"}</small></span></div>
        <div class="fact"><span class="ic">${icon("crew")}</span><span><b>${job.crewNeeded}</b><small>${spanish ? "Personas previstas" : "Crew expected"}</small></span></div>
      </div>
    </section>

    <section class="card talk">
      <div class="orb" id="orb">${icon("mic", "")}</div>
      <h2 id="title">${spanish ? "Toque para hablar" : "Tap to talk"}</h2>
      <p id="sub">${spanish ? "Muster habla primero. Responda con normalidad." : "Muster speaks first. Answer as you normally would."}</p>
      <button class="btn" id="go">${icon("mic")}<span id="goText">${spanish ? "Empezar" : "Start check-in"}</span></button>
      <p class="note" id="note"></p>
      <div class="turns" id="turns"></div>
    </section>`;
  $("go").addEventListener("click", () => (ws ? stop() : start()));
}

function setLive(live) {
  const orb = $("orb");
  if (orb) orb.className = `orb ${live ? "live" : ""}`;
  const go = $("go");
  if (!go) return;
  go.className = `btn ${live ? "end" : ""}`;
  go.innerHTML = live ? `${icon("stop")}<span>Done</span>` : `${icon("mic")}<span>Start check-in</span>`;
}

function say(text, bad = false) {
  const note = $("note");
  if (note) { note.textContent = text; note.className = `note ${bad ? "bad" : ""}`; }
}

async function start() {
  say("Connecting.");
  try {
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule("mic-worklet.js");
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  } catch (ex) {
    return say(ex.name === "NotAllowedError" ? "Muster needs the microphone. Allow it, then tap again." : `Could not start audio: ${ex.message}`, true);
  }
  const src = ctx.createMediaStreamSource(mic);
  node = new AudioWorkletNode(ctx, "mic-capture");
  src.connect(node);
  const mute = ctx.createGain();
  mute.gain.value = 0;
  node.connect(mute).connect(ctx.destination);

  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/browser/stream?t=${encodeURIComponent(token)}`);
  // The speaker sits beside the microphone on a phone, so nothing is sent while
  // Muster speaks: otherwise it hears itself and stops mid sentence.
  node.port.onmessage = (e) => {
    if (musterIsSpeaking()) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "audio", audio: toBase64(e.data) }));
  };
  ws.onopen = () => { setLive(true); say("Listening. Muster will speak first."); };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "audio") play(msg.audio);
    else if (msg.type === "clear") stopPlayback();
    else if (msg.type === "drain") afterPlayback(() => ws && ws.send(JSON.stringify({ type: "drained", id: msg.id })));
    else if (msg.type === "limit") say(msg.message, true);
    else if (msg.type === "call") { callId = msg.callId; poll = setInterval(refresh, 1500); }
  };
  ws.onclose = () => finish();
}

function stop() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "hangup" }));
  finish();
}

function finish() {
  if (poll) { clearInterval(poll); poll = null; }
  stopPlayback();
  if (mic) mic.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  if (ws) { const w = ws; ws = null; try { w.close(); } catch {} }
  mic = ctx = node = null;
  done();
}

function done() {
  view.innerHTML = `
    <section class="card done">
      <div class="tick">${icon("check", "")}</div>
      <h2>Thank you, that is recorded</h2>
      <p>${esc(job.superintendent)} will see your answers on tomorrow's plan for ${esc(job.project)}.</p>
      <ul>
        <li>${icon("check")}<span>What you said was written down word for word</span></li>
        <li>${icon("check")}<span>Anything that needs attention is flagged for the morning</span></li>
        <li>${icon("check")}<span>You can close this page</span></li>
      </ul>
    </section>`;
}

async function refresh() {
  if (!callId) return;
  try {
    const call = await (await fetch(`/api/foreman/${encodeURIComponent(token)}/call/${encodeURIComponent(callId)}`)).json();
    const turns = call.turns || [];
    const box = $("turns");
    if (box) box.innerHTML = turns.map((t) => `<div class="turn ${t.role}"><small>${t.role === "agent" ? "Muster" : esc(job.foreman)}</small>${esc(t.text)}</div>`).join("");
  } catch {}
}

// ---------------------------------------------------------------- audio
function toBase64(buf) {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

function play(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
  const buf = ctx.createBuffer(1, pcm.length, 24000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 0x8000;
  const s = ctx.createBufferSource();
  s.buffer = buf;
  s.connect(ctx.destination);
  playHead = Math.max(playHead, ctx.currentTime);
  s.start(playHead);
  playHead += buf.duration;
  speakingUntil = performance.now() + (playHead - ctx.currentTime) * 1000 + LISTEN_AGAIN_AFTER_MS;
  sources.push(s);
  s.onended = () => { sources = sources.filter((x) => x !== s); };
}

function stopPlayback() {
  sources.forEach((s) => { try { s.stop(); } catch {} });
  sources = [];
  playHead = 0;
  speakingUntil = 0;
}

function afterPlayback(fn) {
  const wait = ctx ? Math.max(0, playHead - ctx.currentTime) * 1000 : 0;
  setTimeout(fn, wait + 100);
}

load();
</script>
</body>
</html>
